# Central configuration for the Hiver Support Agent project.
# Every tunable value used anywhere in the pipeline lives here so the
# whole system is reproducible from one file (see README > Reproducibility).

random_seed: 42

dataset:
  # UPDATED: the real Kaggle "Customer Support on Twitter" dataset was
  # provided by the user and is used from here on. The synthetic
  # generator (src/data/generate_synthetic_dataset.py) is kept in the
  # repo for reference/reproducibility of the earlier synthetic-only
  # milestone but is no longer the default — see DECISION_LOG.md D1 and
  # D15 (the D15 update).
  source: "real"   # "real" or "synthetic"
  raw_path: "data/raw/real_customer_support.csv"
  sample_path: "data/raw/sample_data_applesupport.csv"
  processed_path: "data/processed/processed.csv"
  train_path: "data/processed/train.csv"
  train_weak_labelled_path: "data/processed/train_weak_labelled.csv"  # see src/classification/weak_label_train_data.py
  test_path: "data/processed/test.csv"
  real:
    source_file: "/home/claude/raw_data/twcs/twcs.csv"  # not shipped in repo — see data/README.md
    brands:
      - "AmazonHelp"
      - "AppleSupport"
      - "Uber_Support"
      - "SpotifyCares"
      - "Delta"
    max_per_brand: 1200   # reproducible cap after pairing, keeps runtime/size small (Phase 3)

golden_set:
  path: "data/evaluation/golden_set.csv"
  target_size: 200
  labelling_method: "assistant_single_annotator"   # see README > Golden Set for exactly what this does and doesn't mean

classification:
  tfidf_max_features: 5000
  tfidf_ngram_range: [1, 2]
  logreg_C: 2.0
  logreg_max_iter: 1000

retrieval:
  top_k: 3
  same_brand_boost: 0.15   # additive similarity bonus for same-brand historical cases
  min_similarity_for_grounding: 0.18  # below this, retrieval is treated as "poor"

escalation:
  # Thresholds below are conservative, documented DEFAULTS — they were
  # NOT tuned against held-out validation data (tuning against this
  # project's synthetic golden set would be circular, since its labels
  # were generated by a similar rule; see DECISION_LOG.md D9).
  min_confidence_for_auto_handle: 0.55
  risk_keywords:
    - "fraud"
    - "unauthorized"
    - "lawsuit"
    - "lawyer"
    - "sue"
    - "legal action"
    - "hacked"
    - "stolen"
    - "chargeback"
    - "police"
  poor_retrieval_action: "ESCALATE"   # "ESCALATE" or "CLARIFY"

generation:
  # No LLM API key is available in this environment, so response
  # generation is template + retrieval based (grounded in the retrieved
  # historical case) rather than a live LLM call. See DECISION_LOG D2 and
  # README > "Plugging in a real LLM" for how to switch this on.
  mode: "template_grounded"   # "template_grounded" or "llm_api" (requires ANTHROPIC_API_KEY)
  llm_model: "claude-sonnet-4-6"

judge:
  # Rubric is implemented (src/evaluation/llm_judge.py) but NOT executed
  # anywhere in this project's shipped outputs — no LLM API key is
  # available in this environment. temperature=0 is set so that IF a key
  # is added, judge scores are deterministic/reproducible, not sampled.
  temperature: 0
  criteria: ["correctness", "relevance", "helpfulness", "groundedness", "brand_consistency", "safety"]

intents:
  # 8 substantive intents (unchanged taxonomy from the synthetic phase,
  # re-verified against real message samples — see docs/INTENT_TAXONOMY.md)
  # PLUS an explicit "other" class for real messages that don't fit,
  # which the synthetic dataset never needed (every message was
  # generated to fit one of the 8).
  labels:
    - "order_status"
    - "billing_refund"
    - "account_access"
    - "technical_issue"
    - "cancellation_request"
    - "shipping_delivery"
    - "security_fraud"
    - "general_feedback"
    - "other"
